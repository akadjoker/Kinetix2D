name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to build and publish. Leave empty for a normal CI build."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Restore vcpkg and install dependencies
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
          runVcpkgInstall: true

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DK2D_STATIC_MINGW_RUNTIME=ON
          -DX_VCPKG_APPLOCAL_DEPS_SERIALIZED=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Build editor, runner and export tools
        run: >-
          cmake --build build --config Release
          --target k2d_editor k2d_runner k2d_pack k2d_scriptc k2d_webserver --parallel

      - name: Install release tree
        run: cmake --install build --config Release --prefix "stage/Kinetix2D-${{ matrix.name }}"

      - name: Copy Windows runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path build/vcpkg_installed -Filter *.dll -Recurse |
            Copy-Item -Destination "stage/Kinetix2D-${{ matrix.name }}/bin"

      - name: Verify Windows runner has no GCC runtime DLL dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $imports = & dumpbin /dependents "stage/Kinetix2D-${{ matrix.name }}/bin/k2d_runner.exe" | Out-String
          if ($imports -match '(?i)libgcc_s_.*\.dll|libstdc\+\+-.*\.dll') {
            throw "k2d_runner.exe still depends on a MinGW GCC runtime DLL."
          }

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: |
          cd stage
          zip -r "../Kinetix2D-${{ matrix.name }}.zip" "Kinetix2D-${{ matrix.name }}"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "stage/Kinetix2D-${{ matrix.name }}" -DestinationPath "Kinetix2D-${{ matrix.name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinetix2D-${{ matrix.name }}
          path: Kinetix2D-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: Kinetix2D-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Kinetix2D ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release/*.zip
