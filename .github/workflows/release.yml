name: Build and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Restore vcpkg and install dependencies
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
          runVcpkgInstall: true

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Build editor, runner and packer
        run: cmake --build build --config Release --target k2d_editor k2d_runner k2d_pack k2d_kpak_tests --parallel

      - name: Test KPAK on Linux
        if: runner.os == 'Linux'
        run: ./bin/k2d_kpak_tests

      - name: Test KPAK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bin/k2d_kpak_tests.exe

      - name: Install release tree
        run: cmake --install build --config Release --prefix "stage/Kinetix2D-${{ matrix.name }}"

      - name: Copy Windows runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path build/vcpkg_installed -Filter *.dll -Recurse |
            Copy-Item -Destination "stage/Kinetix2D-${{ matrix.name }}/bin"

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: |
          cd stage
          zip -r "../Kinetix2D-${{ matrix.name }}.zip" "Kinetix2D-${{ matrix.name }}"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "stage/Kinetix2D-${{ matrix.name }}" -DestinationPath "Kinetix2D-${{ matrix.name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinetix2D-${{ matrix.name }}
          path: Kinetix2D-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: Kinetix2D-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.zip
